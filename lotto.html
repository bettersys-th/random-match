<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>จำลองการถูกลอตเตอรี่</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap');
  *{box-sizing:border-box;font-family:'Kanit',sans-serif}
  body{
    margin:0;min-height:100vh;padding:30px 15px;
    background:radial-gradient(circle at top, #3a1c71, #1b0e33 70%);
    color:#fff;text-align:center;overflow-x:hidden
  }
  h1{
    font-size:28px;font-weight:800;margin:0 0 4px;
    background:linear-gradient(90deg,#ffd76b,#ffea00,#ffd76b);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 20px rgba(255,215,0,.3)
  }
  .sub{opacity:.7;font-size:13px;margin-bottom:24px}
  .card{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,215,0,.25);
    border-radius:20px;padding:24px;max-width:460px;margin:0 auto 18px;
    box-shadow:0 8px 30px rgba(0,0,0,.35);backdrop-filter:blur(6px)
  }
  .cardWide{max-width:520px}
  label{font-size:14px;opacity:.85;display:block;margin-bottom:8px}
  input[type=number], input.userNum{
    padding:10px;font-size:18px;border-radius:10px;border:none;
    width:150px;text-align:center;outline:none;font-weight:600;
    background:#fff;color:#222
  }
  input.userNum{width:80px;letter-spacing:1px;padding:8px 4px;font-size:15px}
  select#prizeType{
    padding:10px;font-size:15px;border-radius:10px;border:none;
    width:100%;font-weight:600;background:#fff;color:#222;cursor:pointer
  }
  .prizeInfo{font-size:12px;opacity:.75;margin-top:8px;line-height:1.6}
  .prizeInfo .val{color:#ffd76b;font-weight:700}
  #numbers{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;justify-items:center}
  .numRow{display:flex;flex-direction:column;align-items:center;gap:5px;margin:0}
  .numRow .btnRow{display:flex;gap:6px}
  .delBtn{
    background:#ff5470;border:none;color:#fff;width:24px;height:24px;
    border-radius:50%;cursor:pointer;font-weight:700;font-size:12px
  }
  .rndBtn{
    background:linear-gradient(90deg,#00c6ff,#0072ff);border:none;color:#fff;
    width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:12px
  }
  .addBtn{
    background:linear-gradient(90deg,#2ecc71,#27ae60);border:none;color:#fff;
    padding:9px 18px;border-radius:30px;font-size:14px;font-weight:600;
    cursor:pointer;margin-top:6px
  }
  .addBtn:disabled{opacity:.4;cursor:not-allowed}
  #drawBox{
    font-size:38px;font-weight:800;letter-spacing:8px;
    background:linear-gradient(180deg,#fff,#f2e6c9);color:#1b0e33;
    display:inline-block;padding:16px 26px;border-radius:14px;margin:20px 0 8px;
    box-shadow:0 0 0 4px #ffd700, 0 0 25px rgba(255,215,0,.6);
    min-width:260px
  }
  #drawBox.rolling{animation:shake .08s infinite}
  @keyframes shake{
    0%{transform:translateX(-2px) rotate(-0.5deg)}
    50%{transform:translateX(2px) rotate(0.5deg)}
    100%{transform:translateX(-2px) rotate(-0.5deg)}
  }
  .drawLabel{font-size:12px;opacity:.6;letter-spacing:2px}
  .mainBtn{
    background:linear-gradient(90deg,#ffd700,#ff9f00);
    border:none;color:#241300;font-weight:800;font-size:18px;
    padding:14px 40px;border-radius:40px;cursor:pointer;margin-top:14px;
    box-shadow:0 6px 18px rgba(255,159,0,.45);transition:transform .15s
  }
  .mainBtn:active{transform:scale(.95)}
  .mainBtn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  .resetBtn{
    background:linear-gradient(90deg,#6a5acd,#8a2be2);color:#fff;
    box-shadow:0 6px 18px rgba(138,43,226,.45)
  }
  #result{
    margin-top:22px;font-size:15px;line-height:2;text-align:left;
    background:rgba(0,0,0,.25);border-radius:14px;padding:16px 20px;display:none
  }
  #result .row{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(255,255,255,.15);padding:4px 0}
  #result .row:last-child{border-bottom:none}
  #result .val{font-weight:700;color:#ffd76b}
  .winMsg{
    text-align:center;font-size:19px;font-weight:800;color:#7CFC00;
    margin-top:10px;text-shadow:0 0 12px rgba(124,252,0,.6)
  }
  .loseMsg{text-align:center;font-size:16px;color:#ff8080;margin-top:10px}
  #confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .piece{position:absolute;top:-10px;width:8px;height:14px;opacity:.9;border-radius:2px}

  #overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.65);
    display:none;align-items:center;justify-content:center;z-index:50;padding:16px
  }
  #modal{
    background:linear-gradient(160deg,#2a1350,#1b0e33);
    border:2px solid #ffd700;border-radius:22px;padding:30px 26px;
    max-width:380px;width:100%;text-align:center;position:relative;
    box-shadow:0 0 40px rgba(255,215,0,.5);
    animation:popIn .35s cubic-bezier(.34,1.56,.64,1)
  }
  @keyframes popIn{
    0%{transform:scale(.6);opacity:0}
    100%{transform:scale(1);opacity:1}
  }
  #closeModal{
    position:absolute;top:10px;right:14px;background:none;border:none;
    color:#fff;font-size:20px;cursor:pointer;opacity:.6
  }
  #closeModal:hover{opacity:1}
  .modalTitle{font-size:22px;font-weight:800;margin-bottom:6px}
  .modalNumber{
    font-size:30px;font-weight:800;letter-spacing:6px;color:#ffd76b;
    margin:10px 0
  }
  .ageHighlight{
    font-size:56px;font-weight:800;line-height:1;
    background:linear-gradient(90deg,#ffd700,#ffea00);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin:14px 0 2px
  }
  .ageLabel{font-size:13px;opacity:.75;margin-bottom:14px}
  .ageUnit{
    font-size:56px;font-weight:800;line-height:1;
    background:linear-gradient(90deg,#ffd700,#ffea00);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:14px
  }
  .modalStats{
    text-align:left;font-size:14px;line-height:1.9;
    background:rgba(255,255,255,.06);border-radius:12px;padding:12px 16px;margin-top:10px
  }
  .modalStats .row{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(255,255,255,.15);padding:3px 0}
  .modalStats .row:last-child{border-bottom:none}
  .modalStats .val{font-weight:700;color:#ffd76b}

  .netBox{
    margin-top:12px;border-radius:14px;padding:14px 16px;text-align:center
  }
  .netProfit{background:rgba(124,252,0,.12);border:1px solid rgba(124,252,0,.5)}
  .netLoss{background:rgba(255,84,112,.12);border:1px solid rgba(255,84,112,.5)}
  .netTitle{font-size:13px;opacity:.85;margin-bottom:2px}
  .netAmount{font-size:26px;font-weight:800}
  .netProfit .netAmount{color:#7CFC00}
  .netLoss .netAmount{color:#ff5470}
  .netComment{font-size:13px;margin-top:6px;opacity:.9}

  .modalRetryBtn{
    display:block;width:100%;margin-top:16px;
    background:linear-gradient(90deg,#ffd700,#ff9f00);
    border:none;color:#241300;font-weight:800;font-size:16px;
    padding:12px;border-radius:30px;cursor:pointer;
    box-shadow:0 6px 18px rgba(255,159,0,.45);transition:transform .15s
  }
  .modalRetryBtn:active{transform:scale(.96)}

  @media (max-width: 360px){
    #numbers{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>

<div id="confetti"></div>

<h1>🎰 จำลองโอกาสถูกลอตเตอรี่ 🎰</h1>
<div class="sub">ออกรางวัลเดือนละ 2 ครั้ง · เลข 6 หลัก · ใบละ 80 บาท</div>

<div class="card cardWide">
  <label>🎫 เลขที่คุณเลือก (สูงสุด 12 ใบ)</label>
  <div id="numbers"></div>
  <button class="addBtn" id="addBtnEl" onclick="addNumber()">+ เพิ่มเลข</button>
</div>

<div class="card">
  <label>🏆 รางวัลที่อยากถูก</label>
  <select id="prizeType"></select>
  <div id="prizeInfo" class="prizeInfo"></div>
</div>

<div>
  <div class="drawLabel">เลขที่ออก</div>
  <div id="drawBox">------</div>
</div>

<div>
  <button class="mainBtn" id="goBtn" onclick="simulate()">🎲 เริ่มจำลอง</button>
  <button class="mainBtn resetBtn" onclick="resetAll()">🔄 ลองใหม่</button>
</div>

<div id="overlay">
  <div id="modal">
    <button id="closeModal" onclick="closeModal()">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const PRIZES = [
  {id:'p1',    label:'รางวัลที่ 1',                 amount:6000000, count:1,   digits:6, mode:'full'},
  {id:'p2',    label:'รางวัลที่ 2',                 amount:200000,  count:5,   digits:6, mode:'full'},
  {id:'p3',    label:'รางวัลที่ 3',                 amount:80000,   count:10,  digits:6, mode:'full'},
  {id:'p4',    label:'รางวัลที่ 4',                 amount:40000,   count:50,  digits:6, mode:'full'},
  {id:'p5',    label:'รางวัลที่ 5',                 amount:20000,   count:100, digits:6, mode:'full'},
  {id:'near1', label:'รางวัลข้างเคียงรางวัลที่ 1',   amount:100000,  count:2,   digits:6, mode:'full'},
  {id:'front3',label:'รางวัลเลขหน้า 3 ตัว',          amount:4000,    count:2,   digits:3, mode:'front'},
  {id:'back3', label:'รางวัลเลขท้าย 3 ตัว',          amount:4000,    count:2,   digits:3, mode:'back'},
  {id:'back2', label:'รางวัลเลขท้าย 2 ตัว',          amount:2000,    count:1,   digits:2, mode:'back'}
];

function prizeChance(p){ return p.count / Math.pow(10, p.digits); }

function populatePrizes(){
  const sel = document.getElementById('prizeType');
  const anyOption = `<option value="any">🎇 รางวัลไหนก็ได้ (สุ่มทุกรางวัลพร้อมกัน)</option>`;
  sel.innerHTML = anyOption + PRIZES.map(p=>`<option value="${p.id}">${p.label} (${p.amount.toLocaleString()} บาท)</option>`).join('');
  sel.addEventListener('change', updatePrizeInfo);
  updatePrizeInfo();
}
function updatePrizeInfo(){
  const id = document.getElementById('prizeType').value;
  if(id === 'any'){
    document.getElementById('prizeInfo').innerHTML =
      `🎇 เช็คทุกรางวัล (รางวัลที่ 1-5, ข้างเคียง, เลขหน้า/ท้าย) พร้อมกันในทุกงวด · ถูกอันไหนได้อันนั้น`;
    return;
  }
  const p = PRIZES.find(x=>x.id === id);
  const chance = prizeChance(p);
  document.getElementById('prizeInfo').innerHTML =
    `💰 มูลค่ารางวัล <span class="val">${p.amount.toLocaleString()} บาท</span> ·
     🎯 โอกาสถูกต่อการออก 1 ครั้ง (ต่อ 1 ใบ) <span class="val">1 ใน ${Math.round(1/chance).toLocaleString()}</span>`;
}
populatePrizes();

function addNumber(){
  const wrap = document.getElementById('numbers');
  if(wrap.children.length >= 12) return;
  const div = document.createElement('div');
  div.className = 'numRow';
  div.innerHTML = `<input type="text" maxlength="6" placeholder="XXXXXX" class="userNum">
    <div class="btnRow">
      <button class="rndBtn" title="สุ่มเลข" onclick="randomizeInput(this)">🎲</button>
      <button class="delBtn" onclick="this.parentElement.remove(); updateAddBtn()">✕</button>
    </div>`;
  wrap.appendChild(div);
  updateAddBtn();
}
function updateAddBtn(){
  document.getElementById('addBtnEl').disabled = document.getElementById('numbers').children.length >= 12;
}
function randomizeInput(btn){
  const input = btn.parentElement.parentElement.querySelector('.userNum');
  input.value = pad(Math.floor(Math.random()*1000000));
}
addNumber();

function pad(n){ return n.toString().padStart(6,'0'); }

function launchConfetti(){
  const colors = ['#ffd700','#ff5470','#2ecc71','#00d4ff','#ff9f00','#fff'];
  const holder = document.getElementById('confetti');
  for(let i=0;i<120;i++){
    const p = document.createElement('div');
    p.className='piece';
    p.style.left = Math.random()*100+'vw';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.transform = `rotate(${Math.random()*360}deg)`;
    const duration = 2.5 + Math.random()*2;
    p.animate([
      {transform:`translateY(0) rotate(0deg)`, opacity:1},
      {transform:`translateY(100vh) rotate(${360+Math.random()*360}deg)`, opacity:0}
    ], {duration: duration*1000, easing:'ease-in'});
    holder.appendChild(p);
    setTimeout(()=>p.remove(), duration*1000);
  }
}

function resetAll(){
  document.getElementById('numbers').innerHTML = '';
  addNumber();
  document.getElementById('drawBox').innerText = '------';
  closeModal();
}

function openModal(html, showRetry){
  const retryHtml = showRetry
    ? `<button class="modalRetryBtn" onclick="retryFromModal()">🔄 ลองใหม่</button>`
    : '';
  document.getElementById('modalBody').innerHTML = html + retryHtml;
  document.getElementById('overlay').style.display = 'flex';
}
function retryFromModal(){
  closeModal();
  simulate();
}
function closeModal(){
  document.getElementById('overlay').style.display = 'none';
}

function simulate(){
  const inputs = document.querySelectorAll('.userNum');
  const numbers = [];
  inputs.forEach(inp=>{
    const v = inp.value.trim();
    if(/^\d{6}$/.test(v)) numbers.push(v);
  });

  if(numbers.length === 0){
    openModal(`<div class="modalTitle" style="color:orange">⚠️ กรอกเลขก่อนนะ</div>
      <div style="font-size:14px;opacity:.85">กรุณากรอกเลข 6 หลักอย่างน้อย 1 ใบ</div>`);
    return;
  }

  const prizeId = document.getElementById('prizeType').value;
  const prize = prizeId === 'any' ? {id:'any', label:'รางวัลไหนก็ได้', digits:6} : PRIZES.find(p=>p.id === prizeId);
  const goBtn = document.getElementById('goBtn');
  const drawBox = document.getElementById('drawBox');
  goBtn.disabled = true;
  drawBox.classList.add('rolling');

  // แอนิเมชันหมุนเลขสั้นๆ ให้ตื่นเต้น ก่อนคำนวณจริง
  let ticks = 0;
  const rollTimer = setInterval(()=>{
    drawBox.innerText = randDigits(prize.digits);
    ticks++;
    if(ticks > 18){
      clearInterval(rollTimer);
      drawBox.classList.remove('rolling');
      runSimulation(numbers, prize, drawBox, goBtn);
    }
  }, 60);
}

function randDigits(n){
  let s = '';
  for(let i=0;i<n;i++) s += Math.floor(Math.random()*10);
  return s;
}

function drawCombos(prize){
  const combos = [];
  for(let i=0;i<prize.count;i++) combos.push(randDigits(prize.digits));
  return combos;
}

function ticketSegment(ticket, prize){
  if(prize.mode === 'full') return ticket;
  if(prize.mode === 'front') return ticket.slice(0, prize.digits);
  return ticket.slice(6 - prize.digits);
}

function runSimulation(numbers, prize, drawBox, goBtn){
  const MAX_DRAWS = 50000000;
  const ticketCount = numbers.length;
  const prizePool = prize.id === 'any' ? PRIZES : [prize];
  let draws = 0, draw = '', won = false, wonTiers = [];

  while(draws < MAX_DRAWS){
    draws++;
    const roundWins = [];
    let firstCombo = null;
    for(const p of prizePool){
      const combos = drawCombos(p);
      if(firstCombo === null) firstCombo = combos[0];
      for(let i=0;i<ticketCount;i++){
        const seg = ticketSegment(numbers[i], p);
        if(combos.includes(seg)){
          roundWins.push({label:p.label, amount:p.amount, combo:seg});
          break;
        }
      }
    }
    if(roundWins.length > 0){
      won = true;
      wonTiers = roundWins.sort((a,b)=>b.amount - a.amount);
      draw = wonTiers[0].combo;
      break;
    }
    if(draws === MAX_DRAWS) draw = firstCombo;
  }

  drawBox.innerText = draw;

  const months = draws / 2;
  const years = months / 12;
  const totalCost = draws * 80 * ticketCount;
  const prizeWon = won ? wonTiers.reduce((sum,t)=>sum + t.amount, 0) : 0;
  const wonLabel = won ? wonTiers.map(t=>t.label).join(' + ') : prize.label;
  const net = prizeWon - totalCost;
  const netIsProfit = net >= 0;

  function funComment(){
    const a = Math.abs(net);
    if(netIsProfit){
      if(a > 1000000) return '🚀 รวยเละ! เกษียณได้เลย!';
      if(a > 0) return '🎊 กำไร! เลี้ยงหมูกระป๋องฉลองหน่อย';
      return '😌 เท่าทุนพอดี ไม่เสียไม่ได้';
    } else {
      if(a > 100000000) return '💀 ขาดทุนจนจักรวาลสะเทือน';
      if(a > 10000000) return '😭 ขาดทุนยับเยิน ขายบ้านหนีดีกว่า';
      if(a > 1000000) return '🥵 เจ็บปางตาย แต่ยังหายใจอยู่';
      if(a > 100000) return '🥲 เจ็บอยู่ แต่พอไหว';
      return '🙂 เสียไปนิดหน่อย ถือว่าซื้อความลุ้น';
    }
  }

  const netHtml = `
    <div class="netBox ${netIsProfit ? 'netProfit' : 'netLoss'}">
      <div class="netTitle">${netIsProfit ? '📈 กำไรสุทธิ' : '📉 ขาดทุนสุทธิ'}</div>
      <div class="netAmount">${Math.abs(net).toLocaleString()} บาท</div>
      <div class="netComment">${funComment()}</div>
    </div>`;

  const stats = `
    <div class="modalStats">
      <div class="row"><span>🏆 รางวัล</span><span class="val">${wonLabel}</span></div>
      <div class="row"><span>🎲 จำนวนครั้งที่สุ่ม</span><span class="val">${draws.toLocaleString()} ครั้ง</span></div>
      <div class="row"><span>🗓️ ระยะเวลา</span><span class="val">${months.toLocaleString(undefined,{maximumFractionDigits:1})} เดือน (${years.toLocaleString(undefined,{maximumFractionDigits:2})} ปี)</span></div>
      <div class="row"><span>💸 ค่าลอตเตอรี่รวม</span><span class="val">${totalCost.toLocaleString()} บาท</span></div>
      <div class="row"><span>🎁 เงินรางวัลที่ได้</span><span class="val">${prizeWon.toLocaleString()} บาท</span></div>
    </div>
    ${netHtml}`;

  let html;
  if(won){
    html = `
      <div class="modalTitle">🎉 ถูก${wonLabel}! 🎉</div>
      <div class="modalNumber">${draw}</div>
      <div class="ageLabel">ได้รับเงินรางวัล ${prizeWon.toLocaleString()} บาท ใช้เวลา</div>
      <div class="ageHighlight">${years.toFixed(1)}</div>
      <div class="ageUnit">ปี</div>
      ${stats}
    `;
  } else {
    html = `
      <div class="modalTitle" style="color:#ff8080">😅 ยังไม่ถูกรางวัล</div>
      <div style="font-size:14px;opacity:.85;margin-bottom:6px">ภายในขีดจำกัดการจำลอง</div>
      ${stats}
    `;
  }

  openModal(html, true);
  if(won) launchConfetti();
  goBtn.disabled = false;
}
</script>
</body>
</html>
